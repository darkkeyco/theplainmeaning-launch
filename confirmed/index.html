<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list · The Plain Meaning</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F4F7">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --rhodo:#C2378D; --ink:#1E2123; --paper:#F4F4F7; --iridium:#3E3C3B;
  --chiv:#AEB2C1; --hl:#F3CDE3; --plum:#675F60; --snow:#CCCDD6; --white:#FFFFFF;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
img{max-width:100%;height:auto;display:block}
a{color:var(--ink)}
a:hover{color:var(--rhodo)}
:focus-visible{outline:3px solid var(--rhodo);outline-offset:3px;border-radius:4px}
h1,h2,p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
header{padding:28px 0 0}
header img{width:220px}
.hero{padding:56px 0 40px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--plum)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,6.4vw,58px);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.lede{font-size:19px;color:var(--plum);max-width:56ch}
.soon{display:inline-block;align-self:flex-start;background:var(--hl);color:var(--ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
.event{background:var(--iridium);color:var(--paper);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:10px}
.event .when{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--chiv)}
.event h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.6vw,34px);line-height:1.1}
.event p{color:var(--snow)}
.btn{align-self:flex-start;margin-top:8px;display:inline-block;background:var(--rhodo);color:var(--white);font-weight:700;text-decoration:none;padding:13px 22px;border-radius:999px;min-height:44px}
.btn:hover{background:var(--white);color:var(--ink)}
.series{padding:56px 0 8px;display:flex;flex-direction:column;gap:14px}
.series h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,40px);line-height:1.08;text-wrap:balance}
.dives{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:14px;counter-reset:dd}
.dives li{counter-increment:dd;background:var(--white);border:1px solid var(--snow);border-radius:14px;padding:20px 22px 20px 64px;position:relative}
.dives li::before{content:counter(dd);position:absolute;left:20px;top:18px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;display:grid;place-items:center}
.dives h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0 0 4px}
.dives .promise{font-weight:700;margin-bottom:6px}
.dives p{font-size:16px}
.dives p:not(.promise){color:var(--plum)}
.signup{margin-top:12px;background:var(--hl);border-radius:16px;padding:22px 24px}
.signup label{display:block;font-weight:700;margin-bottom:8px}
.signup .row{display:flex;flex-wrap:wrap;gap:10px}
.signup input{flex:1 1 240px;min-height:48px;border:2px solid var(--ink);border-radius:999px;padding:0 18px;font:inherit;background:var(--white)}
.signup .btn{margin-top:0;border:0;cursor:pointer;font:inherit;font-weight:700}
.signup .fine{font-size:14px;color:var(--ink);margin-top:10px}
@media (max-width:520px){.dives li{padding:56px 18px 18px}.dives li::before{top:16px;left:18px}}
.disclaimer{margin:40px 0;background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:22px 24px}
.disclaimer strong{display:block;font-family:var(--display);font-weight:800;font-size:20px;margin-bottom:6px}
.disclaimer p{font-size:15.5px;color:var(--plum)}
footer{border-top:1px solid var(--snow);padding:22px 0 40px;font-size:14px;color:var(--plum)}
.small{padding:64px 0 40px;display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body>
<header><div class="wrap">
  <a href="/"><img src="/assets/logo-primary.svg" alt="The Plain Meaning" width="1004" height="280"></a>
</div></header>
<main class="wrap"><section class="small">
    <span class="eyebrow">The Plain Meaning Deep Dives</span>

</section></main>

</html>
